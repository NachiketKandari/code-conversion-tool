# .tuxgo.yaml — tuxgo run configuration (PRD F7, R1).
#
# Copy to the working-directory root (next to the tuxgo binary and the tux/
# corpus) and edit. All paths are relative to this file. API keys are
# environment-variable NAMES only — never literals (R6); the Phase 1 loader
# resolves them at runtime. Absent sections fall back to the defaults shown
# here.
#
# Working-directory layout this config assumes (v0.6.3):
#
#   <workdir>/
#     tuxgo                  # built binary (go build -o tuxgo ./cmd/tuxgo)
#     .tuxgo.yaml            # this config
#     tux/                   # the .pc corpus to convert (default input)
#     conversion_logs/       # everything the tool writes (logs, audit, later
#                            #  ledger + IR state) — gitignored
#
# Analyzer scoring weights are deliberately NOT configured here: per-fn
# tuning lives in the generated CSV (tuxgo analyze -weights <csv>).

run:
  profile: isec-vllm          # which models[] entry generation uses (R1)
  temperature: 0.1            # pinned for deterministic runs (Q1)
  maxContextTokens: 16000     # the model's context window — hard ceiling (R2)
  maxPromptTokens: 12000      # assembled-prompt budget: 12k in … (§4.3)
  maxOutputTokens: 4000       # … 4k out
  charsPerToken: 4            # token-estimator ratio (chars/4 heuristic, §4.3) —
                              # tune per model without a code change
  llm: true                   # false = deterministic-only run: models/db/interfaces/
                              # handler/router generate; pending controller bodies are
                              # marked skipped for a later LLM-enabled resume
                              # (CLI -no-llm overrides for one run)

models:                      # OpenAI-compatible profiles, same client seam (R1)
  - name: isec-vllm          # production generation endpoint (default)
    provider: openai-compatible
    model: /opt/vllm/models/qwen3-VL-30B-A3B-Instruct-AWQ   # the exact served id (pr-review parity)
    apiBase: http://10.213.190.86:8002/v1
    apiKeyEnv: ISEC_API_KEY
    requestOptions:
      temperature: 0.1
      maxTokens: 4000
      stream: true           # SSE streaming
      timeout: 120s
      retries: 3
  - name: local-dev-openrouter # local development profile, same schema
    provider: openai-compatible
    model: <openrouter-model-id>   # e.g. qwen/qwen3-vl-30b-a3b-instruct (closest to the isec model)
    apiBase: https://openrouter.ai/api/v1
    apiKeyEnv: OPENROUTER_API_KEY
    # apiKey: <literal>           # local-only alternative to apiKeyEnv: keep it in THIS
    #                             # gitignored file at the workdir root, never commit it (R6).
    #                             # Resolution order: env var first, literal fallback.
    requestOptions:
      temperature: 0.1
      maxTokens: 4000
      stream: true

retrieval:                   # MVP: disabled — deterministic context only (OQ1)
  enabled: false             # V2 = pure-Go BM25, V3 = vector/embeddings —
  # maxContextTokens: 12000  #   both plug in behind the Retriever seam

elision:
  mode: safe                 # bodies → "// … elided" placeholders (G3)

concurrency:
  workers: 1                 # opt-in parallel DB-unit generation; correctness never depends on it

db:
  withGorm: false            # false (default): the plain sqlx-only store — NewXStore(db *sqlx.DB).
                             # true: the nav-example variant where the store also carries the legacy
                             # *gorm.DB handle — NewXStore(oracle *gorm.DB, db *sqlx.DB)

buffers:                     # FML buffer-role registry (PF-4.1): variable names → roles.
  roles:                     # Matching is case-insensitive on the whole name or its last
    Ibuffer: input           # `_`-segment (ptr_fml_Ibuffer → Ibuffer → input). Unknown
    Obuffer: output          # names surface as a visible unknown-role fact, never a guess.
    Sbuffer: send            # Register renamed/other buffer kinds (VIEW, CARRAY, future
    Rbuffer: recv            # conventions) here instead of in code.

convert:                     # defaults for plan/convert so repeat runs need no CLI arguments
  input: ""                  # .pc/.pcf file or directory converted when the CLI passes no
                             # positional target (e.g. tux/SVC_DEMO_LIST.pc)
  mapping: ""                # endpoint-mapping YAML used when -mapping is absent
                             # (e.g. nav.mapping.yaml); explicit CLI flags override both

validate:                    # gofmt → go build → go vet → go test loop (G6)
  maxRetries: 3              # bounded retries with trimmed errors fed back
  compile: auto              # Tier-B compile/run checks (plan-conversion §2):
                             #   auto   — run when paths.mainGo resolves, degrade
                             #            to syntax-only (WARN) when absent
                             #   always — require the target (error if missing)
                             #   never  — skip Tier B even when it could run
  run: false                 # smoke `go run .` after a green Tier B

paths:
  tux: tux/                    # the .pc corpus to convert (OQ19 default: "convert this .pc" locates it here)
  target: ../existing-go-service # existing service: models/db/controller/handler — generated code plugs in (R8)
  mainGo: ""                   # a file inside the target Go module (e.g. <target>/main.go):
                               # the Tier-B anchor — validation walks up to its go.mod.
                               # Empty = the target service is absent on this machine;
                               # conversion then stages output under paths.staged and
                               # validates syntax-only (the two-laptop constraint)
  logs: conversion_logs/logs   # unified slog JSONL stream (Q6)
  audit: conversion_logs/audit  # per-run audit trail (§4.7)
  ledger: conversion_logs/ledger # unit status + source→target conversion map (§4.6, Phase 5)
  state: conversion_logs/state   # IR cache, re-indexed on mtime (Phase 2)
  staged: conversion_logs/_staged # generated-code staging when paths.mainGo is empty
